<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تالار بزرگ | هاگوارتز</title><link rel="stylesheet" href="assets/style.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet"></head><body><canvas id="stars"></canvas>
<nav><a class="brand" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#E8C547" d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>هاگوارتز</a><div class="navlinks"><a href="index.html" class="keep">تالار</a><a href="sorting.html">گروهبندی</a><a href="wand.html">چوبدستی</a><a href="characters.html">شخصیتها</a><a href="spells.html">طلسمها</a><a href="books.html">کتابها</a><a href="greathall.html" class="on">جام</a><a href="events.html">رویدادها</a><span id="meBadge"></span></div></nav>
<main><div class="wrap"><section class="block">
<div class="sec-tag">THE GREAT HALL</div><h2 class="sec-title">جام خانهها</h2><p class="sec-desc" id="cupLead">ساعتشنیهای عظیم — هر امتیازی شنها را بالا میبرد</p>
<div id="lb"></div>
</section><section class="block"><div class="grid g2">
<div class="quizbox"><div class="sec-tag">چالش روزانه دامبلدور</div><h3>معمای روز تالار</h3><p class="sec-desc" style="margin-bottom:10px" id="riddleQ">هر روز یک معما — ۱۰ امتیاز</p><div class="opts" id="riddleOpts"></div><div class="qres" id="riddleRes"></div><div class="bar" style="margin-top:12px"><i id="riddleBar" style="width:0%"></i></div><small style="color:var(--mut);display:block;margin-top:8px">روزی یک بار — فردا معمای جدید</small></div>
<div class="quizbox"><div class="sec-tag">طومار دانشآموزی</div><h3>پروفایل</h3><div id="profile" style="text-align:right;line-height:2.2"></div><div class="field" style="margin-top:12px"><label>تغییر نام</label><input id="nmInput" maxlength="30"></div><button class="btn ghost" id="nmBtn" style="width:100%">ذخیره</button></div>
</div></section></div></main><footer><div class="en">MISCHIEF MANAGED</div></footer>
<script src="assets/app.js"></script><script>
(function(){
  var classDone=((HW.S.cast||[]).length>=3||(HW.S.read||[]).length>=1);
  if(!HW.need(classDone,'اول ۳ طلسم یا ۱ کتاب')) return;
  var COLORS={gryff:'#7F1D1D',slyth:'#0F3A24',raven:'#1A2F5A',huff:'#8B6914'};
  function renderLB(){var lb=document.getElementById('lb');lb.innerHTML='';var L=HW.leader(),mx=Math.max.apply(null,L.map(function(h){return h.p}).concat([1]));L.forEach(function(h,i){var d=document.createElement('div');d.className='card rv vis';d.style.display='grid';d.style.gridTemplateColumns='1fr auto';d.style.gap='4px 12px';d.style.alignItems='center';d.innerHTML='<span style="font-weight:700">'+(i+1)+' — '+h.n+'</span><span style="font-family:Playfair Display,serif;color:var(--gold-lt);font-size:1.3rem">'+h.p+'</span><div style="grid-column:1/-1;height:10px;background:#0A0A0F;border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:'+Math.round(h.p/mx*100)+'%;background:'+COLORS[h.k]+';border-radius:6px"></i></div>';lb.appendChild(d)});document.getElementById('cupLead').textContent='صدر: '+L[0].n+' با '+L[0].p+' امتیاز';}
  function renderProfile(){var p=document.getElementById('profile');function w(){return HW.S.wand?(HW.S.wand.wood+' — '+HW.S.wand.core+' — '+HW.S.wand.len):'هنوز نه (<a href="wand.html" style="color:var(--gold-lt)">اولیواندر</a>)'}p.innerHTML='نام: <b>'+(escHtml(HW.S.name)||'—')+'</b><br>خانه: <b>'+(HW.S.house?HW.HOUSES[HW.S.house]:'—')+'</b><br>چوبدستی: <b>'+w()+'</b><br>پاترونوس: <b>'+(HW.S.patronus||'—')+'</b><br>رکورد: <b>'+HW.S.streak+' روز</b><br>امتیاز تو: <b>'+HW.S.earned+'</b>';document.getElementById('nmInput').value=HW.S.name||''}
  var RIDDLES=[
    {q:'نام سگ سهسر هاگرید؟',o:['فلافی','دامپی','نوبرت'],a:0},
    {q:'پاترونوس هری؟',o:['گوزن','ققنوس','گرگ'],a:0},
    {q:'طلسم باز کردن قفل؟',o:['الوهومورا','لوموس','اکسپلیارموس'],a:0},
    {q:'جغد هری؟',o:['هدویگ','پیگ','ارول'],a:0},
    {q:'سازنده سنگ جادو؟',o:['نیکلاس فلامل','دامبلدور','اسنیپ'],a:0}
  ];
  function idx(){var d=new Date();return (d.getFullYear()*1000+d.getMonth()*50+d.getDate())%RIDDLES.length}
  function can(){return HW.S.lastRiddle!==HW.today()}
  function paintRiddle(){
    var r=RIDDLES[idx()];document.getElementById('riddleQ').textContent=r.q;
    var bar=document.getElementById('riddleBar'),done=!can();bar.style.width=done?'100%':'0%';
    var c=document.getElementById('riddleOpts');c.innerHTML='';var res=document.getElementById('riddleRes');
    if(done){res.textContent='امروز جواب دادی — فردا برگرد';return}
    res.textContent='';r.o.forEach(function(txt,i){var b=document.createElement('button');b.className='opt';b.textContent=txt;b.onclick=function(){if(!can())return;HW.S.lastRiddle=HW.today();HW.save();if(i===r.a){if(HW.S.house) HW.award(HW.S.house,10,'معمای دامبلدور');res.textContent='آفرین! ۱۰ امتیاز';bar.style.width='100%'}else{res.textContent='جواب درست: '+r.o[r.a];bar.style.width='100%'}c.innerHTML='';renderLB();renderProfile()};c.appendChild(b)});
  }
  document.getElementById('nmBtn').onclick=function(){var v=document.getElementById('nmInput').value.trim();if(v.length<2){HW.toast('نام کوتاه است');return}HW.S.name=v;HW.save();HW.renderBadge();renderProfile();HW.toast('ذخیره شد')};
  document.addEventListener('DOMContentLoaded',function(){renderLB();renderProfile();paintRiddle()});
})();
</script></body></html>
