<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تالار بزرگ | هاگوارتز</title><link rel="stylesheet" href="assets/style.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet"></head><body><canvas id="stars"></canvas>
<nav><a class="brand" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#E8C547" d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>هاگوارتز</a><div class="navlinks"><a href="index.html" class="keep">تالار</a><a href="sorting.html">گروهبندی</a><a href="wand.html">چوبدستی</a><a href="characters.html">شخصیتها</a><a href="spells.html">طلسمها</a><a href="books.html">کتابها</a><a href="greathall.html" class="on">جام</a><a href="events.html">رویدادها</a><span id="meBadge"></span></div></nav>
<main><div class="wrap">
<section class="block" style="text-align:center;background:radial-gradient(ellipse 60% 40% at 50% 0%,#1A1628 0%,transparent 70%);border-radius:20px;padding:40px 18px"><div class="sec-tag">ENCHANTED CEILING</div><h2 class="sec-title">تالار بزرگ — سقف جادویی</h2><p class="sec-desc" style="margin:0 auto 14px">سقف تالار آسمان بیرون را نشان میدهد — کتاب اول: «سقف جادو شده تا آسمان را بازتاب دهد»</p><div style="height:8px;background:linear-gradient(90deg,#0A0A0F,#1A1628,#0A0A0F);border-radius:999px;opacity:.6"></div></section>
<section class="block"><h3 class="sec-title" style="font-size:1.4rem">جام خانهها — ساعتشنیها</h3><p class="sec-desc" id="cupLead">هر امتیاز کلاسی شنها را جابجا میکند</p><div id="lb"></div></section>
<section class="block"><div class="quizbox"><div class="sec-tag">طومار</div><h3>پروفایل جادوگر</h3><div id="profile" style="text-align:right;line-height:2.2"></div><div class="field" style="margin-top:12px"><label>تغییر نام</label><input id="nmInput" maxlength="30"></div><button class="btn ghost" id="nmBtn" style="width:100%">ذخیره</button></div></section>
</div></main><footer><div class="en">MISCHIEF MANAGED</div></footer>
<script src="assets/app.js"></script><script>
(function(){
  var COLORS={gryff:'#7F1D1D',slyth:'#0F3A24',raven:'#1A2F5A',huff:'#8B6914'};
  function renderLB(){var lb=document.getElementById('lb');lb.innerHTML='';var L=HW.leader(),mx=Math.max.apply(null,L.map(function(h){return h.p}).concat([1]));L.forEach(function(h,i){var d=document.createElement('div');d.className='card rv vis';d.style.display='grid';d.style.gridTemplateColumns='1fr auto';d.style.gap='4px 12px';d.innerHTML='<span style="font-weight:700">'+(i+1)+' — '+h.n+'</span><span style="font-family:Playfair Display,serif;color:var(--gold-lt);font-size:1.3rem">'+h.p+'</span><div style="grid-column:1/-1;height:9px;background:#0A0A0F;border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:'+Math.round(h.p/mx*100)+'%;background:'+COLORS[h.k]+'"></i></div>';lb.appendChild(d)});document.getElementById('cupLead').textContent='صدر: '+L[0].n+' با '+L[0].p+' سنگ قیمتی در ساعتشنی';}
  function renderProfile(){var p=document.getElementById('profile');function w(){return HW.S.wand?(HW.S.wand.wood+' — '+HW.S.wand.core+' — '+HW.S.wand.len):'هنوز نه'}p.innerHTML='نام: <b>'+(escHtml(HW.S.name)||'—')+'</b><br>خانه: <b>'+(HW.S.house?HW.HOUSES[HW.S.house]:'—')+'</b><br>چوبدستی: <b>'+w()+'</b><br>پاترونوس: <b>'+(HW.S.patronus||'—')+'</b><br>امتیاز تو: <b>'+HW.S.earned+'</b><br>رکورد ورود: <b>'+HW.S.streak+' روز</b>';document.getElementById('nmInput').value=HW.S.name||''}
  document.getElementById('nmBtn').onclick=function(){var v=document.getElementById('nmInput').value.trim();if(v.length<2){HW.toast('کوتاه است');return}HW.S.name=v;HW.save();HW.renderBadge();renderProfile();HW.toast('ذخیره شد')};
  document.addEventListener('DOMContentLoaded',function(){renderLB();renderProfile()});
})();
</script></body></html>
