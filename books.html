<script src="assets/app.js"></script><script>
(function(){
  var B=[
    {y:'1997',t:'۱. سنگ جادو',d:'نامه، سنگ و آینه نفاقانگیز'},
    {y:'1998',t:'۲. تالار اسرار',d:'دفترچه تام ریدل و شمشیر گریفیندور'},
    {y:'1999',t:'۳. زندانی آزکابان',d:'سیریوس، دیوانهساز و پاترونوس'},
    {y:'2000',t:'۴. جام آتش',d:'اژدها و بازگشت ولدمورت'},
    {y:'2003',t:'۵. محفل ققنوس',d:'ارتش دامبلدور'},
    {y:'2005',t:'۶. شاهزاده دورگه',d:'جانپیچها'},
    {y:'2007',t:'۷. یادگاران مرگ',d:'نبرد هاگوارتز'}
  ];
  if(!HW.S.read) HW.S.read=[];
  var tl=document.getElementById('tl');
  function prog(){document.getElementById('bprog').textContent=HW.S.read.length+' از '+B.length}
  B.forEach(function(b,i){
    var d=document.createElement('div');d.className='book rv';
    function paint(){var done=HW.S.read.indexOf(i)>=0;d.innerHTML='<span class="yr">'+b.y+'</span><b>'+b.t+'</b><p style="color:var(--mut);font-size:.9rem">'+b.d+'</p><button class="btn '+(done?'ghost':'gold')+'" style="padding:8px 20px;font-size:.86rem;margin-top:10px">'+(done?'خوانده شد':'خواندم — ۴ امتیاز')+'</button>';d.querySelector('button').onclick=function(){if(HW.S.read.indexOf(i)>=0) return;HW.S.read.push(i);HW.save();if(HW.S.house) HW.award(HW.S.house,4,b.t);paint();prog()}}
    paint();tl.appendChild(d);
  });prog();
})();
