<main><div class="wrap"><section class="block">
<div class="sec-tag">OLLIVANDERS</div><h2 class="sec-title">چوب تو را انتخاب میکند</h2><p class="sec-desc">ویترینهای بلند تا سقف — آقای اولیواندر جعبه درست را از قفسه بیرون میکشد</p>
<div class="grid g2">
<div class="quizbox" id="wandBox"><div class="sec-tag" id="wStep"></div><h3 id="wQ"></h3><div class="opts" id="wOpts"></div><div class="qres" id="wRes"></div></div>
<div class="quizbox"><div class="sec-tag">آزمون پاترونوس</div><h3 id="pQ"></h3><div class="opts" id="pOpts"></div><div class="qres" id="pRes"></div></div>
</div>
</section></div></main><footer><div class="en">MISCHIEF MANAGED</div></footer>
<script src="assets/app.js"></script><script>
(function(){
  if(!HW.need(!!HW.S.house,'اول گروهبندی شو')) return;
  var WQ=[
    {q:'کدام قفسه تو را صدا میزند؟',o:[['بلندترین قفسه چوبی',['هالی','تاکسوس','بلوط']],['میانیترین قفسه',['افرا','بید','گیلاس']],['تاریکترین گوشه',['گردو','آبنوس','سرخدار']]]},
    {q:'دستت را روی پیشخوان میگذاری؟',o:[['گرمای تند',['پر ققنوس']],['سوزن سوزن خنک',['مو تکشاخ']],['ضربان سنگین',['قلب اژدها']]]},
    {q:'چوبدستی را تکان میدهی؟',o:[['باران جرقه طلایی',['۲۸ سانتی','انعطافپذیر']],['نسیم و برگ رقصان',['۳۱ سانتی','متعادل']],['رعد آرام',['۳۴ سانتی','سرسخت']]]}
  ];
  var wi=0,wood='',core='',len='';
  var wStep=document.getElementById('wStep'),wQ=document.getElementById('wQ'),wO=document.getElementById('wOpts'),wR=document.getElementById('wRes');
  function wShow(){wR.textContent='';wStep.textContent='سؤال '+(wi+1)+' از '+WQ.length+' — اولیواندر';wQ.textContent=WQ[wi].q;wO.innerHTML='';WQ[wi].o.forEach(function(op){var b=document.createElement('button');b.className='opt';b.textContent=op[0];b.onclick=function(){if(wi===0)wood=op[1][Math.floor(Math.random()*op[1].length)];if(wi===1)core=op[1][0];if(wi===2)len=op[1][0]+' ـ '+op[1][1];wi++;if(wi<WQ.length)wShow();else wFinish()};wO.appendChild(b)});}
  function wFinish(){wStep.textContent='اولیواندر لبخند میزند';wQ.textContent='جالب... خیلی جالب...';wO.innerHTML='';HW.S.wand={wood:wood,core:core,len:len};HW.save();wR.innerHTML='چوب '+wood+'، مغز '+core+'، '+len;if(HW.S.house) HW.award(HW.S.house,5,'چوبدستی');var r=document.createElement('button');r.className='opt';r.style.marginTop='12px';r.textContent='آزمون دوباره';r.onclick=function(){wi=0;wShow()};wO.appendChild(r);}
  var PQ=[{q:'شادترین خاطرهات؟',o:[['پرواز بر فراز دریاچه',['گوزن']],['خنده با دوستان کنار آتش',['سگ']],['نامه هاگوارتز',['جغد']],['دویدن در جنگل ممنوعه',['گرگ']]]},{q:'دیوانهساز نزدیک است — به چه فکر میکنی؟',o:[['نور صبح',['اسب']],['آواز ققنوس',['ققنوس']],['آغوش مادر',['خرس']],['آسمان پرستاره',['پلنگ برفی']]]}];
  var pi=0,votes={};var pQ=document.getElementById('pQ'),pO=document.getElementById('pOpts'),pR=document.getElementById('pRes');
  function pShow(){pR.textContent='';pQ.textContent='سؤال '+(pi+1)+' از '+PQ.length+': '+PQ[pi].q;pO.innerHTML='';PQ[pi].o.forEach(function(op){var b=document.createElement('button');b.className='opt';b.textContent=op[0];b.onclick=function(){votes[op[1]]=(votes[op[1]]||0)+1;pi++;if(pi<PQ.length)pShow();else pFinish()};pO.appendChild(b)});}
  function pFinish(){var best='',n=0;for(var k in votes) if(votes[k]>n){n=votes[k];best=k} pQ.textContent='اکسپکتو پاترونوم!';pO.innerHTML='';HW.S.patronus=best;HW.save();pR.innerHTML='پاترونوس تو: <b>'+best+'</b> از نوک چوبدستیت جهید.';HW.flash();if(HW.S.house) HW.award(HW.S.house,5,'پاترونوس');}
  wShow();pShow();
})();
</script></body></html>
