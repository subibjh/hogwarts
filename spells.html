<main><div class="wrap"><section class="block">
<div class="sec-tag">CHARMS CLASS</div><h2 class="sec-title">کلاس پروفسور فلیتویک</h2><p class="sec-desc">هر طلسم را اجرا کن — اولین اجرای موفق ۳ امتیاز دارد. پیشرفت: <b id="prog" style="color:var(--gold-lt)"></b></p>
<div class="grid g4" id="spells"></div>
</section></div></main><footer><div class="en">MISCHIEF MANAGED</div></footer>
<script src="assets/app.js"></script><script>
(function(){
  if(!HW.need(!!(HW.S.wand&&HW.S.patronus),'اول چوبدستیات را بگیر')) return;
  var SP=[
    {l:'Expecto Patronum',n:'پاترونوس',d:'دفاع در برابر دیوانهساز'},
    {l:'Lumos',n:'لوموس',d:'روشن کردن چوبدستی'},
    {l:'Wingardium Leviosa',n:'ویناردیوم لویاوسا',d:'شناور کردن اشیا'},
    {l:'Expelliarmus',n:'اکسپلیارموس',d:'خلع سلاح'},
    {l:'Protego',n:'پروتگو',d:'سپر محافظ'},
    {l:'Incendio',n:'اینسندیو',d:'افروختن شعله'},
    {l:'Alohomora',n:'الوهومورا',d:'باز کردن قفل'},
    {l:'Riddikulus',n:'ریدیکولوس',d:'مضحک کردن بوگارت'},
    {l:'Stupefy',n:'استاپیفای',d:'بیهوشکننده'},
    {l:'Petrificus Totalus',n:'پتریفیکوس',d:'خشک کردن بدن'},
    {l:'Obliviate',n:'ابلیوییت',d:'پاک کردن خاطره'},
    {l:'Avada Kedavra',n:'آوادا کداورا',d:'نفرین مرگ — ممنوع'}
  ];
  if(!HW.S.cast) HW.S.cast=[];
  var g=document.getElementById('spells');
  function prog(){document.getElementById('prog').textContent=HW.S.cast.length+' از '+SP.length+' آموخته شده';}
  SP.forEach(function(s){
    var d=document.createElement('div');d.className='card rv';d.style.textAlign='center';d.style.cursor='pointer';
    function paint(){
      var done=HW.S.cast.indexOf(s.l)>=0;
      d.style.borderColor=done?'var(--gold)':'';
      d.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24"><path fill="'+(done?'#E8C547':'#3A3530')+'" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2zm7 11l.9 3.1L23 17l-3.1.9L19 21l-.9-3.1L15 17l3.1-.9L19 13z"/></svg><span style="font-family:Playfair Display,serif;font-style:italic;color:var(--gold-lt);font-size:1.18rem;display:block;margin:8px 0 2px">'+s.l+'</span><b>'+s.n+'</b><br><small style="color:var(--mut)">'+s.d+'</small>'+(done?'<br><small style="color:var(--gold-lt)">آموخته شد</small>':'');
    }
    paint();
    d.onclick=function(){
      HW.flash();
      if(s.l==='Avada Kedavra'){HW.toast('این طلسم ممنوع است!');return}
      HW.toast(s.l+' — اجرا شد');
      if(HW.S.cast.indexOf(s.l)<0){HW.S.cast.push(s.l);HW.save();if(HW.S.house) HW.award(HW.S.house,3,'اجرای '+s.n);paint();prog();}
    };
    g.appendChild(d);
  });
  prog();
})();
</script></body></html>
